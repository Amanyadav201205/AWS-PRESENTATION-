<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>AWS Well-Architected Framework</title>
    <script>
      // Single Page App redirect for GitHub Pages
      sessionStorage.redirect = location.href;
      var repoPath = location.pathname.split('/')[1];
      location.replace(location.pathname.startsWith('/' + repoPath) ? '/' + repoPath + '/' : '/');
    </script>
    <meta http-equiv="refresh" content="0;URL='./'">
  </head>
  <body>
    <p>Redirecting to AWS Well-Architected Framework...</p>
  </body>
</html>
